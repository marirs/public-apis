name: "Validate links"

on:
  schedule:
    - cron:  '0 0 * * *'
  push:
    branches:
      - master

env:
  FORMAT_FILE: README.md

jobs:
  test:
    name: 'Validate links'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate all links from README.md
        run: build/validate_links.py ${FORMAT_FILE}
